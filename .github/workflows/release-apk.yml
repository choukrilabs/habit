name: Build & Publish Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release version tag to publish (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Debug & Release Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Ensure debug.keystore exists for debugConfig signing
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare release keystore (from GitHub Secrets if configured, or auto-generate fallback)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret found; generating self-signed release keystore..."
            STORE_PASS="habitradar_release_pass"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASS" \
              -alias upload \
              -keypass "$STORE_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Habit Radar,OU=Mobile,O=HabitRadar,L=Global,S=Global,C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          fi

          # 3. Ensure .env exists if .env.example is present
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Build Debug and Signed Release APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Prepare Release Assets & SHA-256 Checksums
        id: package_apks
        run: |
          VERSION_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p release-assets

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          cp "$RELEASE_APK" "release-assets/HabitRadar-${VERSION_TAG}-release.apk"
          cp "$DEBUG_APK" "release-assets/HabitRadar-${VERSION_TAG}-debug.apk"

          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HabitRadar-${{ steps.package_apks.outputs.version_tag }}-APKs
          path: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release with APK Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_apks.outputs.version_tag }}
          name: "Habit Radar ${{ steps.package_apks.outputs.version_tag }}"
          generate_release_notes: true
          files: |
            release-assets/HabitRadar-${{ steps.package_apks.outputs.version_tag }}-release.apk
            release-assets/HabitRadar-${{ steps.package_apks.outputs.version_tag }}-debug.apk
            release-assets/SHA256SUMS.txt
          body: |
            ### 📲 Download & Install Habit Radar (${{ steps.package_apks.outputs.version_tag }})
            Download one of the Android `.apk` packages under **Assets** below:
            - **`HabitRadar-${{ steps.package_apks.outputs.version_tag }}-release.apk`** — Signed release build (recommended for daily use).
            - **`HabitRadar-${{ steps.package_apks.outputs.version_tag }}-debug.apk`** — Debug build for testing and inspection.
            - **`SHA256SUMS.txt`** — SHA-256 checksums for verifying APK integrity.
